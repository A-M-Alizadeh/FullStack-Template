[project]
name = "dpp-backend"
version = "0.1.0"
description = "Digital Product Passport API"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "sqlalchemy==2.0.51",
    "alembic==1.19.0",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.4",
    "pyjwt==2.13.0",
    "bcrypt==5.0.0",
    "python-multipart==0.0.32",
    "pydantic-settings==2.11.0",
    "email-validator==2.2.0",
    "qrcode==8.2",
    "pillow==11.3.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
]
