# Render Blueprint: API + Postgres.
# Dashboard → New → Blueprint → connect this repo (branch: master).
# After the first deploy, set CORS_ORIGINS / FRONTEND_URL to your Vercel URL
# (see docs/DEPLOY.md).
#
# Free-tier Postgres/plans change over time — adjust `plan` in the dashboard if needed.

databases:
  - name: dpp-db
    # Free Postgres is legacy; smallest current plan (paid). Adjust in dashboard if needed.
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: dpp-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: Digital Product Passport API
      - key: APP_VERSION
        value: 0.1.0
      - key: DEBUG
        value: "false"
      - key: API_PREFIX
        value: /api/v1
      - key: DATABASE_URL
        fromDatabase:
          name: dpp-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_EXPIRE_DAYS
        value: "14"
      # Replace after Vercel deploy (must match the browser origin exactly).
      - key: CORS_ORIGINS
        value: '["https://your-app.vercel.app"]'
      - key: FRONTEND_URL
        value: https://your-app.vercel.app
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_AUTH
        value: 10/minute
      - key: RATE_LIMIT_PUBLIC
        value: 60/minute
      - key: RATE_LIMIT_API
        value: 120/minute
      - key: STORAGE_BACKEND
        value: local
      - key: UPLOAD_DIR
        value: uploads
      - key: SOFT_DELETE_RETENTION_DAYS
        value: "30"
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
      - key: REDIS_URL
        value: ""
      - key: WEB_CONCURRENCY
        value: "2"
      - key: RUN_MIGRATIONS_ON_START
        value: "true"
