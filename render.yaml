# Free-path Blueprint: API only (no Render Postgres — that needs a card).
# Database: Neon free tier → paste connection string into DATABASE_URL.
# Full steps: docs/DEPLOY.md
#
# Dashboard → New → Blueprint → this repo / master.

services:
  - type: web
    name: dpp-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: Digital Product Passport API
      - key: APP_VERSION
        value: 0.1.0
      - key: DEBUG
        value: "false"
      - key: API_PREFIX
        value: /api/v1
      # Set in the Render dashboard after creating a Neon database (sync: false).
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_EXPIRE_DAYS
        value: "14"
      # Replace after Vercel deploy (exact browser origin, no trailing slash).
      - key: CORS_ORIGINS
        value: '["https://your-app.vercel.app"]'
      - key: FRONTEND_URL
        value: https://your-app.vercel.app
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_AUTH
        value: 10/minute
      - key: RATE_LIMIT_PUBLIC
        value: 60/minute
      - key: RATE_LIMIT_API
        value: 120/minute
      - key: STORAGE_BACKEND
        value: local
      - key: UPLOAD_DIR
        value: uploads
      - key: SOFT_DELETE_RETENTION_DAYS
        value: "30"
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
      - key: REDIS_URL
        value: ""
      - key: WEB_CONCURRENCY
        value: "1"
      - key: RUN_MIGRATIONS_ON_START
        value: "true"
